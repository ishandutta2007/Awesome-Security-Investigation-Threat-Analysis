<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #9ca3af;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #60a5fa;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.4;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    .dash-flow {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Overlay -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />

    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="350" y1="0" x2="350" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="950" y1="0" x2="950" y2="320" />
    <line x1="1150" y1="0" x2="1150" y2="320" />
  </g>

  <!-- Dynamic Glowing Background Elements (Behind Text) -->
  <circle cx="1050" cy="80" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="240" r="120" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" />
  <path d="M -50 260 Q 300 120 600 240 T 1250 180" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="dash-flow" opacity="0.5" />
  <path d="M -50 280 Q 350 160 650 280 T 1250 220" fill="none" stroke="#3b82f6" stroke-width="1.5" class="dash-flow" opacity="0.3" />

  <!-- Shield / Radar Vector Graphics (Right Side) -->
  <g transform="translate(920, 50)" filter="url(#softShadow)">
    <rect width="200" height="220" rx="16" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
    <!-- Outer Shield Icon -->
    <path d="M100 35 L155 60 V115 C155 155 100 185 100 185 C100 185 45 155 45 115 V60 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>
    <!-- Radar Waves -->
    <circle cx="100" cy="105" r="25" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <circle cx="100" cy="105" r="40" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
    <circle cx="100" cy="105" r="6" fill="#38bdf8"/>
  </g>

  <!-- Foreground Content: Header & Text -->
  <g transform="translate(60, 0)">
    <!-- Pill Category Tag -->
    <g transform="translate(0, 55)">
      <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="16" y="22" class="badge-text">🛡️ THREAT HUNTING &amp; SIEM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="title" filter="url(#softShadow)">
      Security Investigation &amp; Threat Analysis
    </text>

    <!-- Subtitle -->
    <text x="0" y="182" class="subtitle">
      Curated List of Commercial SIEM Platforms &amp; Open-Source Analytics Tools
    </text>

    <!-- Interactive Badges / Metadata Row -->
    <g transform="translate(0, 220)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="12" y="23" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="600">📊 Market: $10.5B+</text>

      <!-- Item 2 -->
      <rect x="172" y="0" width="180" height="36" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="184" y="23" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="600">⚡ 25+ Open Source</text>

      <!-- Item 3 -->
      <rect x="364" y="0" width="180" height="36" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="376" y="23" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="600">🎯 SOC &amp; DFIR Ready</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
